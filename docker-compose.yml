services:
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

  db:
    image: postgres
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      - ./db/seed_users.sh:/docker-entrypoint-initdb.d/02-seed-users.sh